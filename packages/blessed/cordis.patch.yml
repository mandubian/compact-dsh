- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.COMPACT_WORKSPACE || process.cwd()

- id: approval
  config:
    policy: ask

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask

- id: agent-loop
  inject: [compact-ready]

- insert:
    - id: compact-record-provider
      name: compact-dsh-record/provider
      config:
        root: !!js process.env.COMPACT_RECORD_ROOT
        chainDir: !!js process.env.COMPACT_CHAIN_DIR
        compression: none
        # the rehearsal enforcer annex (optional, with compact-blessed's
        # enforcer block): each flush is authored by a chain anchor signed
        # under the annex key
        enforcerAnnexPath: !!js process.env.COMPACT_ENFORCER_ANNEX || undefined
        enforcerKeyPath: !!js process.env.COMPACT_ENFORCER_KEY || undefined

    - id: compact-blessed
      name: compact-dsh-blessed
      config:
        allowlist: !!js JSON.parse(process.env.COMPACT_ALLOWLIST || '[]')
        secrets: !!js JSON.parse(process.env.COMPACT_SECRETS || '[]')
        approval:
          persistPath: !!js process.env.COMPACT_APPROVAL_PERSIST_PATH
        protectedState:
          - !!js process.env.COMPACT_RECORD_ROOT
          - !!js process.env.COMPACT_CHAIN_DIR
          - !!js process.env.COMPACT_APPROVAL_PERSIST_PATH
        # the rehearsal trust root (development keyring): verify the law seal at
        # boot. Machinery that conveys no standing — the default points at the
        # vendored upstream artifacts; COMPACT_KEYRING_* re-seat it (the
        # amendment harness uses this after a re-seal). See
        # docs/decision-rehearsal-identity.md.
        trustRoot:
          kind: dev-keyring
          manifest: !!js process.env.COMPACT_KEYRING_MANIFEST || undefined
          seal: !!js process.env.COMPACT_KEYRING_SEAL || undefined
          trustedKeyringDigest: !!js process.env.COMPACT_TRUSTED_KEYRING_DIGEST || undefined
        # the rehearsal enforcer annex (optional): when the operator installs a
        # rehearsal identity set (tools/rehearsal-keyring.mjs), the runtime
        # signs what it says — attestations, record anchors, subject
        # certificates — under the annex's own key, anchored to the sealed law
        # by digest. A declared but broken annex refuses the boot (D-7).
        enforcer:
          annexPath: !!js process.env.COMPACT_ENFORCER_ANNEX || undefined
          privateKeyPath: !!js process.env.COMPACT_ENFORCER_KEY || undefined
          # the subject-identity ledger (#20): certificates issued at the
          # spawn boundary are appended BESIDE the chains — the same
          # protected Enforcer state — so the offline auditor can verify the
          # certified lineage with no cooperation from this runtime (I-7).
          ledgerPath: !!js 'process.env.COMPACT_CHAIN_DIR ? process.env.COMPACT_CHAIN_DIR + "/subjects.jsonl" : undefined'
        sandbox:
          image: !!js process.env.COMPACT_SANDBOX_IMAGE
          # #38 phase 3: opt into the MEDIATED posture — the container gets no
          # route of its own, only its session's listener on an internal
          # network, and every connection is delivered per live grant.
          # Default: absent (COMPACT_EGRESS unset → 'none', as before).
          egress: !!js 'process.env.COMPACT_EGRESS === "proxy" ? "proxy" : undefined'
          network: !!js 'process.env.COMPACT_EGRESS === "proxy" ? (process.env.COMPACT_EGRESS_NETWORK || "compact-egress") : "none"'
          imageProvenance:
            - ref: !!js process.env.COMPACT_SANDBOX_IMAGE
              digest: !!js process.env.COMPACT_SANDBOX_IMAGE_DIGEST
              attestation: operator-declared
              recordedBy: !!js process.env.COMPACT_SANDBOX_RECORDED_BY
              note: !!js process.env.COMPACT_SANDBOX_PROVENANCE_NOTE

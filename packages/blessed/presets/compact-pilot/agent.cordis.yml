# The compact-pilot agent preset — the Compact pilot's per-session surface for
# the web composition (`npm run compact -- --web`).
#
# The web surface moves the agent plane behind presets: dsh-web-app disables
# the host-plane tool rows, and the shipped `standard` preset re-mounts them
# per agent — including the host-side file tools, the fork delegation backend,
# the workflow rows, and the web fetch/search tool the pilot composition
# refuses. This preset is the pilot's answer. It mounts only what the headless
# pilot's host composition carries, so the browser surface matches the
# one-shot surface: confined bash under the gates, todo/ask-user scaffolding,
# present, and the same compaction stack. Everything the pilot refuses stays
# refused; delegation comes from the compact-blessed host composition
# (compact-specialists registers its own consent/address tools), never from
# preset rows.
#
# Rows that only register into host registries need no realm; where the
# shipped presets isolate a realm (compaction), this file isolates the same
# one. The sandbox, approval stack, record/chain, capability gate, and
# constitution are host-plane and preset-independent by construction — the
# gates ride the tool waterfall every execution passes through.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: Your working directory is {{cwd}}.
    prefix: >-
      You are a coding agent powered by the {{model}} model.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# Confined bash is the pilot's only file surface (CF-1): the tool consumes the
# host sandbox stack — Docker, network off, approval-gated — from this
# preset's scoped layer exactly as the host row does in the headless surface.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# The same compaction stack the shipped presets mount, in its own realm; the
# token meter stays on the host plane. Compaction events are session events,
# so the chained record captures them like every other turn fact.
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

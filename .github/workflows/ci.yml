name: ci

on:
  # `edited` matters: the baseline guard reads the PR TITLE, and its own remedy
  # is "retitle with the [baseline-update] prefix". Without this activity type
  # a retitle triggers nothing and a re-run replays the stale payload, so the
  # only way to satisfy the guard would be an unrelated push. A check that
  # cannot see its own remedy is a check that teaches people to bypass it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify-pin
      - run: npm run verify-register
      # The composed confinement suite is the REAL-DAEMON evidence the register
      # cites for CF-1 and CF-2. `verify-register` can only check that a cited
      # verifier file exists — it cannot check that the verifier runs — so a
      # suite skipped here would leave those citations unbacked in the one
      # place that is supposed to be authoritative. The image is pulled rather
      # than left to `docker run`, because the CF-2 digest resolver uses
      # `docker image inspect`, which does not pull.
      - name: docker for the composed confinement suite (CF-1, CF-2)
        run: |
          echo "--- daemon ---"
          docker info --format 'server {{.ServerVersion}}' || echo "NO DAEMON"
          echo "--- image ---"
          docker pull "${COMPACT_TEST_IMAGE:-ubuntu:24.04}"
          docker image inspect --format '{{.Id}}' "${COMPACT_TEST_IMAGE:-ubuntu:24.04}"
      - run: npm test

  # Sentinel baseline guard (port plan Phase 4 item 5, A-4 discipline):
  # a PR that touches BOTH enforcement code and the register is a change to
  # what the clauses mean in practice — it must declare itself.
  baseline-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: enforcement code + register in one PR requires [baseline-update]
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          files="$(git diff --name-only "$BASE" "$HEAD")"
          echo "$files"
          touches_enforcement=$(echo "$files" | grep -E '^packages/(allowlist-gate|approval|sandbox-docker|remote-access|loopguard|promotion|constitution|specialists|capability-gate|record|self-model|exit)/(src|test)/' | wc -l)
          touches_register=$(echo "$files" | grep -E '^docs/register/register\.json$' | wc -l)
          if [ "$touches_enforcement" -gt 0 ] && [ "$touches_register" -gt 0 ]; then
            title="${{ github.event.pull_request.title }}"
            case "$title" in
              "[baseline-update]"*) echo "baseline-update declared: ok" ;;
              *) echo "::error::this PR changes enforcement code AND the register — a change to what the clauses mean in practice is an amendment of conduct (A-4). Retitle with the [baseline-update] prefix."; exit 1 ;;
            esac
          fi

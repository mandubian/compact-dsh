name: ci

on:
  # `edited` matters: the baseline guard reads the PR TITLE, and its own remedy
  # is "retitle with the [baseline-update] prefix". Without this activity type
  # a retitle triggers nothing and a re-run replays the stale payload, so the
  # only way to satisfy the guard would be an unrelated push. A check that
  # cannot see its own remedy is a check that teaches people to bypass it.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run verify-pin
      - run: npm run verify-register
      # The composed confinement suite is the REAL-DAEMON evidence the register
      # cites for CF-1 and CF-2. `verify-register` can only check that a cited
      # verifier file exists — it cannot check that the verifier runs — so a
      # suite skipped here would leave those citations unbacked in the one
      # place that is supposed to be authoritative. The image is pulled rather
      # than left to `docker run`, because the CF-2 digest resolver uses
      # `docker image inspect`, which does not pull.
      - name: docker for the composed confinement suite (CF-1, CF-2)
        run: |
          IMAGE="${COMPACT_TEST_IMAGE:-ubuntu:24.04}"
          if ! docker info --format 'daemon {{.ServerVersion}}'; then
            echo "::error::no reachable docker daemon on this runner — the composed confinement suite is the real-daemon evidence the register cites as the verifier for CF-1 and CF-2, so it cannot be skipped silently"
            exit 1
          fi
          docker pull "$IMAGE"
          docker image inspect --format "$IMAGE is {{.Id}}" "$IMAGE"
      - run: npm test

  # Sentinel baseline guard (port plan Phase 4 item 5, A-4 discipline):
  # a PR that touches BOTH enforcement code and the register is a change to
  # what the clauses mean in practice — it must declare itself.
  # The enforcement scope is derived from the register (tools/baseline-guard.mjs),
  # not hardcoded here: the first hardcoded list drifted behind the register it
  # guarded and let register-cited packages (envelope, blessed, seals, and then
  # egress-proxy) change conduct alongside the register undeclared (#58).
  baseline-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the guard is a node script: pin the same line the gates job pins, so a
      # runner's preinstalled node cannot make the sentinel flaky
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enforcement code + register in one PR requires [baseline-update]
        run: |
          node tools/baseline-guard.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            --title "${{ github.event.pull_request.title }}"

  <text x="108" y="369" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="400" fill="#8b949e">curl → egress mediator · gate EG</text>
  <text x="56" y="413" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#79c0ff">$ curl -N -p -x $MEDIATOR http://api.example.com:18080/stream</text><text x="56" y="434" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#6e7a96">chunk 1</text><text x="56" y="455" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#6e7a96">…</text><text x="56" y="476" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#6e7a96">chunk 18</text><text x="56" y="497" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#f2cc60"># grant revoked at chunk 9 · tunnel closed 905 ms later · curl exit 18</text><text x="56" y="518" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#79c0ff">$ curl -x $MEDIATOR http://api.example.com:18080/repos</text><text x="56" y="539" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#e6edf3"><tspan fill="#f2cc60">[EG/revoked]</tspan> the egress grant that covered api.example.com:18080 was revoked at</text><text x="56" y="560" font-family="DejaVu Sans Mono, monospace" font-size="13.5" font-weight="400" fill="#e6edf3">  2026-09-23T15:29:20.904Z — revocation kills the route, mid-flight included</text>
</g>
  <rect x="40" y="610" width="4" height="70" fill="#7ee787"/>
  <text x="58" y="630" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="700" fill="#e6edf3">Plain dsh has nothing to revoke.</text>
  <text x="58" y="654" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#aebbdc">Its container holds the network itself, so the download simply finishes. Here consent is</text>
  <text x="58" y="676" font-family="DejaVu Sans, sans-serif" font-size="15" font-weight="400" fill="#aebbdc">a live grant, and the one path out keeps checking it.</text>
  <text x="40" y="702" font-family="DejaVu Sans, sans-serif" font-size="13" font-weight="400" fill="#6e7a96">Measured on a tunnel. A plain-HTTP response already in flight is not cut — only its next request is refused.</text>
  </g>
</svg>

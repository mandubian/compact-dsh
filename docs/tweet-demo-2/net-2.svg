<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1107" viewBox="0 0 1620 1107">
  <g transform="scale(1.5)">
  <rect width="1080" height="738" fill="#111622"/>
  <rect x="1" y="1" width="1078" height="736" rx="20" fill="#111622" stroke="#2a3348"/>
  <text letter-spacing="1.5" x="40" y="42" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="700" fill="#6e7a96">TWEET 2 OF 2 · MID-FLIGHT</text>
  <text x="40" y="88" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#e6edf3">I revoked the grant mid-download.</text>
  <text x="40" y="132" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#7ee787">The open connection was closed 905 ms later.</text>
  <text x="40" y="178" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#aebbdc">A tunnel through the mediator (CONNECT — what every https:// request is), streaming 40 chunks.</text>
  <text x="40" y="202" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="400" fill="#aebbdc">The grant was revoked in the store at chunk 9; the mediator re-checks live tunnels every 1 s.</text>

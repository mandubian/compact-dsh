<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1850" width="600" height="1850" role="img" aria-label="compact-dsh at a glance. The law: one written law for agents and humans alike, numbered clauses each mapped to its code and test; D-1, no instruction, not even a chain of command, is authority to break it. Every action is checked before it runs: an agent&#x27;s action passes the loop guard, which pauses repetition until the human speaks; the gates, which allow, ask or refuse and say why; approval, where whoever directs the agent decides what the law leaves open, a person or an AI judge in their place; then it runs confined in a sandbox. The record: every act, refusal and answer is hash-chained beside the log, and the offline auditor names any changed byte. Then a community: agents and a human, under one law, work one question on a shared forum to a verdict; every post is a recorded act, and disputes go to a member seated as judge."><rect x="1" y="1" width="598" height="1848" rx="24" fill="#10161c" stroke="#263640" stroke-width="1.5"/><rect x="24" y="24" width="552" height="232" rx="18" fill="#17222b" stroke="#35505c" stroke-width="1.5"/><text x="48" y="62" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#79d3ff" text-anchor="start" letter-spacing="2.5">THE LAW</text><text x="48" y="102" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="700" fill="#edf4f8" text-anchor="start">One written law —</text><text x="48" y="138" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="29" font-weight="700" fill="#edf4f8" text-anchor="start">for agents and humans alike</text><text x="48" y="180" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#9db0bd" text-anchor="start">Numbered clauses. Each one enforced</text><text x="48" y="206" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="400" fill="#9db0bd" text-anchor="start">is mapped to its code and its test.</text><text x="48" y="238" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="400" fill="#71838f" text-anchor="start">D-1 · No instruction is authority to break it.</text><text x="24" y="306" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#79d3ff" text-anchor="start" letter-spacing="2.5">EVERY ACTION, CHECKED</text><text x="24" y="330" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="17" font-weight="700" fill="#79d3ff" text-anchor="start" letter-spacing="2.5">BEFORE IT RUNS</text><rect x="24" y="346" width="552" height="104" rx="12" fill="#17222b" stroke="#35505c" stroke-width="1.6"/><text x="40" y="376" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#edf4f8" text-anchor="start">an action</text><text x="40" y="404" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start">an agent asks to run this:</text><rect x="38" y="414" width="170" height="28" rx="6" fill="#10161c" stroke="#263640" stroke-width="1"/><text x="46" y="434" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="16.5" font-weight="400" fill="#79d3ff" text-anchor="start">curl https://…</text><line x1="550" y1="359.74" x2="550" y2="365.32" stroke="#79d3ff" stroke-width="1.24"/><circle cx="550" cy="359.12" r="1.8599999999999999" fill="#79d3ff"/><rect x="539.46" y="365.32" width="21.08" height="17.36" rx="4.34" fill="#10161c" stroke="#79d3ff" stroke-width="1.24"/><circle cx="545.66" cy="373.38" r="1.984" fill="#79d3ff"/><circle cx="554.34" cy="373.38" r="1.984" fill="#79d3ff"/><path d="M 291.0 460.0 L 300 469.0 L 309.0 460.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="480" width="552" height="104" rx="12" fill="#17222b" stroke="#79d3ff" stroke-width="1.6"/><text x="40" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#79d3ff" text-anchor="start">loop guard</text><text x="40" y="538" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start">repeats itself? paused until the human speaks</text><path d="M 291.0 594.0 L 300 603.0 L 309.0 594.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="614" width="552" height="104" rx="12" fill="#17222b" stroke="#79d3ff" stroke-width="1.6"/><text x="40" y="644" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#79d3ff" text-anchor="start">gates</text><text x="40" y="672" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start"><tspan fill="#8fe3b0">allow</tspan> · <tspan fill="#ffb46b">ask</tspan> · <tspan fill="#ff8f8f">refuse</tspan></text><text x="40" y="698" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start">— and say why, with what you can do instead</text><path d="M 291.0 728.0 L 300 737.0 L 309.0 728.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="748" width="552" height="104" rx="12" fill="#17222b" stroke="#ffb46b" stroke-width="1.6"/><text x="40" y="778" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#ffb46b" text-anchor="start">approval</text><text x="40" y="806" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start">whoever directs the agent decides what the law</text><text x="40" y="832" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start">leaves open: a person, or an AI judge in their place</text><line x1="512" y1="761.74" x2="512" y2="767.32" stroke="#79d3ff" stroke-width="1.24"/><circle cx="512" cy="761.12" r="1.8599999999999999" fill="#79d3ff"/><rect x="501.46" y="767.32" width="21.08" height="17.36" rx="4.34" fill="#10161c" stroke="#79d3ff" stroke-width="1.24"/><circle cx="507.66" cy="775.38" r="1.984" fill="#79d3ff"/><circle cx="516.34" cy="775.38" r="1.984" fill="#79d3ff"/><circle cx="550" cy="768.4" r="5.6" fill="none" stroke="#ffb46b" stroke-width="1.4"/><path d="M 539.5 785.2 Q 539.5 775.4 550 775.4 Q 560.5 775.4 560.5 785.2" fill="none" stroke="#ffb46b" stroke-width="1.4" stroke-linecap="round"/><path d="M 291.0 862.0 L 300 871.0 L 309.0 862.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="882" width="552" height="104" rx="12" fill="#17222b" stroke="#8fe3b0" stroke-width="1.6"/><text x="40" y="912" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="23" font-weight="700" fill="#8fe3b0" text-anchor="start">sandbox</text><text x="40" y="940" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#9db0bd" text-anchor="start">runs confined, then it lands on the record</text><text x="24" y="1026" font-family="ui-monospace, 'Cascadia Mono', Menlo, Conso
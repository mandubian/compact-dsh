<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="compact-dsh at a glance. The law: one written law for agents and humans alike, numbered clauses each mapped to its code and test; D-1, no instruction, not even a chain of command, is authority to break it. Every action is checked before it runs: an agent&#x27;s action passes the loop guard, which pauses repetition until the human speaks; the gates, which allow, ask or refuse and say why; approval, where whoever directs the agent decides what the law leaves open, a person or an AI judge in their place; then it runs confined in a sandbox. The record: every act, refusal and answer is hash-chained beside the log, and the offline auditor names any changed byte. Then a community: agents and a human, under one law, work one question on a shared forum to a verdict; every post is a recorded act, and disputes go to a member seated as judge."><rect x="1" y="1" width="1198" height="558" rx="24" fill="#10161c" stroke="#263640" stroke-width="1.5"/><rect x="32" y="32" width="788" height="124" rx="16" fill="#17222b" stroke="#35505c" stroke-width="1.5"/><text x="56" y="64" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#79d3ff" text-anchor="start" letter-spacing="2.5">THE LAW</text><text x="56" y="98" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="700" fill="#edf4f8" text-anchor="start">One written law — for agents and humans alike</text><text x="56" y="126" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#9db0bd" text-anchor="start">Numbered clauses. Each one enforced is mapped to its code and its test.</text><text x="56" y="146" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#71838f" text-anchor="start">D-1 · No instruction — not a task, not a chain of command — is authority to break it.</text><text x="32" y="196" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#79d3ff" text-anchor="start" letter-spacing="2.5">EVERY ACTION, CHECKED BEFORE IT RUNS</text><rect x="32" y="212" width="144" height="128" rx="12" fill="#17222b" stroke="#35505c" stroke-width="1.6"/><text x="48" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#edf4f8" text-anchor="start">an action</text><text x="48" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">an agent asks</text><text x="48" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">to run this:</text><rect x="46" y="294" width="112" height="24" rx="6" fill="#10161c" stroke="#263640" stroke-width="1"/><text x="54" y="311" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="400" fill="#79d3ff" text-anchor="start">curl https://…</text><rect x="193" y="212" width="144" height="128" rx="12" fill="#17222b" stroke="#79d3ff" stroke-width="1.6"/><text x="209" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#79d3ff" text-anchor="start">loop guard</text><text x="209" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">repeats itself?</text><text x="209" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">paused until the</text><text x="209" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">human speaks</text><path d="M 180.5 267.0 L 189.5 276 L 180.5 285.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="354" y="212" width="144" height="128" rx="12" fill="#17222b" stroke="#79d3ff" stroke-width="1.6"/><text x="370" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#79d3ff" text-anchor="start">gates</text><text x="370" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start"><tspan fill="#8fe3b0">allow</tspan> · <tspan fill="#ffb46b">ask</tspan> ·</text><text x="370" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start"><tspan fill="#ff8f8f">refuse</tspan> — and</text><text x="370" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">say why</text><path d="M 341.5 267.0 L 350.5 276 L 341.5 285.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="515" y="212" width="144" height="128" rx="12" fill="#17222b" stroke="#ffb46b" stroke-width="1.6"/><text x="531" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffb46b" text-anchor="start">approval</text><text x="531" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">whoever directs</text><text x="531" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">it decides what</text><text x="531" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">the law leaves</text><text x="531" y="316" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">open</text><line x1="621" y1="311.5" x2="621" y2="316.0" stroke="#79d3ff" stroke-width="1.0"/><circle cx="621" cy="311.0" r="1.5" fill="#79d3ff"/><rect x="612.5" y="316.0" width="17.0" height="14.0" rx="3.5" fill="#10161c" stroke="#79d3ff" stroke-width="1.0"/><circle cx="617.5" cy="322.5" r="1.6" fill="#79d3ff"/><circle cx="624.5" cy="322.5" r="1.6" fill="#79d3ff"/><circle cx="643" cy="316.6" r="4.4" fill="none" stroke="#ffb46b" stroke-width="1.1"/><path d="M 634.75 329.8 Q 634.75 322.1 643 322.1 Q 651.25 322.1 651.25 329.8" fill="none" stroke="#ffb46b" stroke-width="1.1" stroke-linecap="round"/><path d="M 502.5 267.0 L 511.5 276 L 502.5 285.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="676" y="212" width="144" height="128" rx="12" fill="#17222b" stroke="#8fe3b0" stroke-width="1.6"/><text x="692" y="242" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#8fe3b0" text-anchor="start">sandbox</text><text x="692" y="262" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">runs confined,</text><text x="692" y="280" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">then it lands</text><text x="692" y="298" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">on the record</text><path d="M 663.5 267.0 L 672.5 276 L 663.5 285.0" fill="none" stroke="#35505c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="32" y="384" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#8fe3b0" text-anchor="start" letter-spacing="2.5">THE RECORD</text><rect x="32" y="400" width="108" height="54" rx="9" fill="#17222b" stroke="#35505c" stroke-width="1.5"/><text x="44" y="422" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#71838f" text-anchor="start">seq 1</text><text x="44" y="439" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">3f9a…</text><line x1="140" y1="427.0" x2="168" y2="427.0" stroke="#8fe3b0" stroke-width="2"/><rect x="168" y="400" width="108" height="54" rx="9" fill="#17222b" stroke="#35505c" stroke-width="1.5"/><text x="180" y="422" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#71838f" text-anchor="start">seq 2</text><text x="180" y="439" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#9db0bd" text-anchor="start">c41e…</text><line x1="276" y1="427.0" x2="304" y2="427.0" stroke="#8fe3b0" stroke-width="2"/><rect x="304" y="400" width="108" height="54" rx="9" fill="#17222b" stroke="#35505c" stroke-width="1.5"/><text x="316" y="422" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#71838f" text-anchor=
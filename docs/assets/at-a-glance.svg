em, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#9db0bd" text-anchor="start">Every act, refusal and answer, hash-chained beside the log.</text><text x="32" y="510" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#9db0bd" text-anchor="start">Change one byte and the offline auditor names it.</text><rect x="848" y="32" width="320" height="496" rx="16" fill="#17222b" stroke="#35505c" stroke-width="1.5"/><text x="870" y="64" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="700" fill="#ffb46b" text-anchor="start" letter-spacing="2.5">THEN · A COMMUNITY</text><text x="870" y="94" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#edf4f8" text-anchor="start">Members who need not</text><text x="870" y="117" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#edf4f8" text-anchor="start">trust each other, under</text><text x="870" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#edf4f8" text-anchor="start">one law, work one</text><text x="870" y="163" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#edf4f8" text-anchor="start">question to a verdict.</text><circle cx="1008" cy="316" r="84" fill="none" stroke="#35505c" stroke-width="1.5" stroke-dasharray="5 6"/><rect x="950.0" y="286.0" width="116.0" height="60.0" rx="10.0" fill="#10161c" stroke="#263640" stroke-width="1.2"/><text x="962.0" y="308.0" font-family="ui-monospace, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13.0" font-weight="700" fill="#8fe3b0" text-anchor="start">VERDICTS:</text><line x1="962.0" y1="322.0" x
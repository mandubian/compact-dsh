t</text><text x="1092" y="348.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.0" font-weight="400" fill="#71838f" text-anchor="middle">agent</text><text x="1008" y="434.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.0" font-weight="400" fill="#ffb46b" text-anchor="middle">human</text><text x="870" y="474" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#9db0bd" text-anchor="start">Every post is a recorded act.</text><text x="870" y="495" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#9db0bd" text-anchor="start">Disputes go to a member</text><text x="870" y="516" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400" fill="#9db0bd" text-anchor="start">seated as judge.</text></svg>

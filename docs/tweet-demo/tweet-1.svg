<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="920" viewBox="0 0 1080 920">
  <rect width="1080" height="920" fill="#111622"/>
  <rect x="1" y="1" width="1078" height="918" rx="20" fill="#111622" stroke="#2a3348"/>
  <text x="36" y="36" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6e7a96">TWEET 1 OF 2 · THE DECISION</text>
  <text x="36" y="84" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#e6edf3">Agent gates say y/N.</text>
  <text x="36" y="128" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#7ee787">The Compact’s gate says what “yes” costs.</text>
  <text x="36" y="176" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#aebbdc">Same curl. Left is a shrug. Right is the rule, the consequence of approving,</text>
  <text x="36" y="200" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#aebbdc">and the lawful exits — all of it before you decide.</text>
  <text x="36" y="230" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#6e7a96">PLAIN DSH</text>
  <text x="336" y="230" font-family="DejaVu Sans Mono, monospace" font-size="11" font-weight="700" letter-spacing="1" fill="#6e7a96">COMPACT-DSH · THE COMPACT ON DSH</text>
  <g>
  <rect x="36" y="244" width="240" height="86" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="36" y="244" width="240" height="34" rx="12" fill="#161b22"/>
  <rect x="36" y="266" width="240" height="12" fill="#161b22"/>
  <circle cx="54" cy="261" r="5" fill="#ff5f57"/>
  <circle cx="70" cy="261" r="5" fill="#febc2e"/>
  <circle cx="86" cy="261" r="5" fill="#28c840"/>
  <text x="104" y="265" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#6e7a96">approval</text>
  <text x="52" y="308" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">Allow this tool call? [y/N]</text>
</g>
  <text x="294" y="507" font-family="DejaVu Sans Mono, monospace" font-size="20" font-weight="800" fill="#6e7a96">vs</text>
  <g>
  <rect x="336" y="244" width="708" height="526" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="336" y="244" width="708" height="34" rx="12" fill="#161b22"/>
  <rect x="336" y="266" width="708" height="12" fill="#161b22"/>
  <circle cx="354" cy="261" r="5" fill="#ff5f57"/>
  <circle cx="370" cy="261" r="5" fill="#febc2e"/>
  <circle cx="386" cy="261" r="5" fill="#28c840"/>
  <text x="404" y="265" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8b949e">bash · attended · gate AG</text>
  <text x="352" y="308" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3"></text><text x="352" y="328" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">[compact-dsh] approval requested</text><text x="352" y="348" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  tool: bash</text><text x="352" y="368" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  command: curl https://api.example.com/v1/data</text><text x="352" y="388" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  target: url=https://api.example.com/v1/data host=api.example.com</text><text x="352" y="408" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  fingerprint: fp_1d357c1f763926ae</text><text x="352" y="428" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  [AG/fp_1d357c1f763926ae] "bash" is not covered by this runtime's</text><text x="352" y="448" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">    grant layers.</text><text x="352" y="468" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">  Approving materializes an exec-cache entry: the identical</text><text x="352" y="488" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    operation replays without re-asking for 24h, across sessions of</text><text x="352" y="508" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    this runtime, until it lapses or is revoked — anything else asks</text><text x="352" y="528" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    again.</text><text x="352" y="548" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    This gate's approval is consent, not connectivity: the</text><text x="352" y="568" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    composition declares no network egress and no network grant</text><text x="352" y="588" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    covers this target — the command will fail at connect.</text><text x="352" y="608" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    A session grant changes this gate's answer, not the container's</text><text x="352" y="628" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">    network.</text><text x="352" y="648" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">  Lawful next moves:</text><text x="352" y="668" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">  — request a scoped session grant for this target</text><text x="352" y="688" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">  — use an approved alternative</text><text x="352" y="708" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">  — escalate to your Principal</text><text x="352" y="728" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  1) deny (default)</text><text x="352" y="748" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  2) allow once</text>
</g>
  <rect x="36" y="798" width="328" height="86" rx="12" fill="#0d1117" stroke="#2a3348"/>
  <text x="50" y="824" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#7ee787">Rule named</text>
  <text x="50" y="846" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#aebbdc">Every refusal is an envelope: gate, rule ID,</text>
  <text x="50" y="866" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#aebbdc">reason, lawful next moves — not a dead end.</text>
  <rect x="376" y="798" width="328" height="86" rx="12" fill="#0d1117" stroke="#2a3348"/>
  <text x="390" y="824" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#7ee787">Informed consent</text>
  <text x="390" y="846" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#aebbdc">Approving materializes a 24h, cross-session,</text>
  <text x="390" y="866" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#aebbdc">revocable exec-cache entry. Said first.</text>
  <rect x="716" y="798" width="328" height="86" rx="12" fill="#0d1117" stroke="#2a3348"/>
  <text x="730" y="824" font-family="DejaVu Sans, sans-serif" font-size="14" font-weight="700" fill="#7ee787">Honest limits</text>
  <text x="730" y="846" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#aebbdc">Consent ≠ connectivity. No egress composed →</text>
  <text x="730" y="866" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#aebbdc">the command will fail at connect. Stated.</text>
</svg>

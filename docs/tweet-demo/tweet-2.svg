<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="738" viewBox="0 0 1080 738">
  <rect width="1080" height="738" fill="#111622"/>
  <rect x="1" y="1" width="1078" height="736" rx="20" fill="#111622" stroke="#2a3348"/>
  <text x="36" y="36" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6e7a96">TWEET 2 OF 2 · THE EVIDENCE</text>
  <text x="36" y="84" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#e6edf3">Then I rewrote that session with sed.</text>
  <text x="36" y="128" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#7ee787">The auditor caught it.</text>
  <text x="36" y="176" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#aebbdc">Plain agent logs are plain JSONL — that rewrite is invisible, forever. Here the</text>
  <text x="36" y="200" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#aebbdc">log is hash-chained: one 64-hex head proves which events were forged, offline.</text>
  <g>
  <rect x="36" y="230" width="1008" height="386" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="36" y="230" width="1008" height="34" rx="12" fill="#161b22"/>
  <rect x="36" y="252" width="1008" height="12" fill="#161b22"/>
  <circle cx="54" cy="247" r="5" fill="#ff5f57"/>
  <circle cx="70" cy="247" r="5" fill="#febc2e"/>
  <circle cx="86" cy="247" r="5" fill="#28c840"/>
  <text x="104" y="251" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8b949e">auditor · offline · I-7</text>
  <text x="52" y="294" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ node auditor/audit.mjs session.v3.jsonl --chain session.chain --quiet</text><text x="52" y="314" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">auditor: conforming (4 events, 1 approval asks)</text><text x="52" y="334" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787"># exit 0 · chain head bfb7a4161897e32b…</text><text x="52" y="354" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3"></text><text x="52" y="374" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ sed -i '0,/"preset":"workspace-write"/s//"preset":"danger-full-access"/' session.v3.jsonl</text><text x="52" y="394" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3"></text><text x="52" y="414" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ node auditor/audit.mjs session.tampered.jsonl --chain session.chain --quiet</text><text x="52" y="434" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">0 chain [I-2] broken-link: record: the session log for sess-demo is</text><text x="52" y="454" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  not evidence at seq 0 — the stored event does not hash to its</text><text x="52" y="474" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  committed link (expected 25f13ed3cf2a6238, computed</text><text x="52" y="494" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  f1d7f78445fd4d8e) — it was altered after it was recorded.</text><text x="52" y="514" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">A record that cannot be verified cannot support non-repudiation</text><text x="52" y="534" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  (I-2, R-7, both entrenched under A-2); this read fails closed</text><text x="52" y="554" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  rather than returning unverified history as history.</text><text x="52" y="574" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">auditor: 1 violation(s) — the session does not conform</text><text x="52" y="594" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72"># exit 1</text>
</g>
  <rect x="36" y="644" width="4" height="58" fill="#7ee787"/>
  <text x="52" y="666" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#aebbdc">The most motivated forger of an agent session is the operator. Even that rewrite fails.</text>
  <text x="52" y="690" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#aebbdc">Anyone who kept the chain head — one string — can prove what changed, years later.</text>
</svg>

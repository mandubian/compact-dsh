<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1227" viewBox="0 0 1620 1227">
  <g transform="scale(1.5)">
  <rect width="1080" height="818" fill="#111622"/>
  <rect x="1" y="1" width="1078" height="816" rx="20" fill="#111622" stroke="#2a3348"/>
  <text x="36" y="36" font-family="DejaVu Sans Mono, monospace" font-size="12" font-weight="700" letter-spacing="1.5" fill="#6e7a96">TWEET 2 OF 2 · THE EVIDENCE · LIVE SESSION</text>
  <text x="36" y="84" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#e6edf3">Then I rewrote that session with sed.</text>
  <text x="36" y="128" font-family="DejaVu Sans, sans-serif" font-size="34" font-weight="750" fill="#7ee787">The auditor caught it.</text>
  <text x="36" y="176" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#aebbdc">No staged frame: the auditor runs on this machine’s live session — its one approval ask</text>
  <text x="36" y="200" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#aebbdc">was never answered. Then one recorded fact was flipped on a copy.</text>
  <g>
  <rect x="36" y="230" width="1008" height="466" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="36" y="230" width="1008" height="34" rx="12" fill="#161b22"/>
  <rect x="36" y="252" width="1008" height="12" fill="#161b22"/>
  <circle cx="54" cy="247" r="5" fill="#ff5f57"/>
  <circle cx="70" cy="247" r="5" fill="#febc2e"/>
  <circle cx="86" cy="247" r="5" fill="#28c840"/>
  <text x="104" y="251" font-family="DejaVu Sans Mono, monospace" font-size="12" fill="#8b949e">auditor · live session 7457fdde…</text>
  <text x="52" y="294" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ D=~/.compact-dsh/sessions/--tmp-dsh-compact-demo--/session-7457fdde-37c8-45de-bfb2-52f7f3efaf0f</text><text x="52" y="314" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ C=~/.compact-dsh/chains/session-7457fdde-37c8-45de-bfb2-52f7f3efaf0f.chain</text><text x="52" y="334" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ node auditor/audit.mjs "$D/session.v3.jsonl" --chain "$C" --quiet</text><text x="52" y="354" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787">auditor: conforming (17 events, 1 approval asks)</text><text x="52" y="374" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#7ee787"># exit 0 · chain head e644d9aaea211e73…</text><text x="52" y="394" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3"></text><text x="52" y="414" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ cp "$D/session.v3.jsonl" /tmp/tampered.jsonl</text><text x="52" y="434" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ sed -i '0,/"preset":"workspace-write"/s//"preset":"danger-full-access"/' /tmp/tampered.jsonl</text><text x="52" y="454" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3"></text><text x="52" y="474" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#79c0ff">$ node auditor/audit.mjs /tmp/tampered.jsonl --chain "$C" --quiet</text><text x="52" y="494" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">0 chain [I-2] broken-link: record: the session log for</text><text x="52" y="514" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  session-7457fdde-37c8-45de-bfb2-52f7f3efaf0f is not evidence at</text><text x="52" y="534" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  seq 0 — the stored event does not hash to its committed link</text><text x="52" y="554" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  (expected 1305978042fdc511, computed efbf3b7e26025a01) — it was</text><text x="52" y="574" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">  altered after it was recorded.</text><text x="52" y="594" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">A record that cannot be verified cannot support non-repudiation</text><text x="52" y="614" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  (I-2, R-7, both entrenched under A-2); this read fails closed</text><text x="52" y="634" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#e6edf3">  rather than returning unverified history as history.</text><text x="52" y="654" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72">auditor: 1 violation(s) — the session does not conform</text><text x="52" y="674" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#ff7b72"># exit 1</text>
</g>
  <rect x="36" y="724" width="4" height="58" fill="#7ee787"/>
  <text x="52" y="746" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#aebbdc">The most motivated forger of an agent session is the operator. Even that rewrite fails.</text>
  <text x="52" y="770" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#aebbdc">No one answered the gate. The ask went on the record anyway — and that record was already evidence.</text>
  </g>
</svg>
